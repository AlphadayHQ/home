name: Deploy to zettaday (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-zettaday-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  API_BASE_URL: https://api.zettaday.com
  ECR_REPOSITORY: alphaday-home-dev
  ORIGIN_STACK: alphaday-home-dev-origin
  VITE_CLARITY_PROJECT_ID: ${{ secrets.DEV__LANDING__CLARITY_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::402248308880:role/alphaday-home-dev-home-deployer

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and test image
        run: |
          docker build \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            --target test \
            --tag alphaday-home:test .
          docker run --rm alphaday-home:test

      - name: Verify runtime image
        run: |
          docker build \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            --tag alphaday-home:runtime .
          docker run --detach \
            --memory 900m \
            --name alphaday-home-runtime \
            alphaday-home:runtime
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' alphaday-home-runtime)" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' alphaday-home-runtime)" = healthy
          runtime_dist="$(mktemp -d)"
          docker cp alphaday-home-runtime:/app/dist/. "$runtime_dist"
          docker run --rm \
            --network container:alphaday-home-runtime \
            --volume "$runtime_dist:/app/dist:ro" \
            --workdir /app \
            alphaday-home:test \
            node scripts/verify-ssr.mjs http://127.0.0.1:3000
          docker stop --timeout 10 alphaday-home-runtime
          test "$(docker inspect --format '{{.State.ExitCode}}' alphaday-home-runtime)" = 0
          docker rm alphaday-home-runtime

      - name: Push immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker tag alphaday-home:runtime "$image"
          docker push "$image"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy image through Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          INSTANCE_QUERY: AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]
        run: |
          asg="$(aws cloudformation describe-stacks \
            --stack-name "$ORIGIN_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AutoScalingGroupName'].OutputValue" \
            --output text)"
          instance_id="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$asg" \
            --query "$INSTANCE_QUERY" \
            --output text)"
          test -n "$instance_id"
          test "$instance_id" != None
          script="$(base64 scripts/deploy-container.sh | tr -d '\n')"
          parameters="$(jq -cn \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg script "$script" \
            '{commands:["echo " + $script + " | base64 -d > /tmp/deploy-container.sh", "chmod 700 /tmp/deploy-container.sh", "/tmp/deploy-container.sh " + ($image | @sh) + " " + ($region | @sh)]}')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$instance_id" \
            --parameters "$parameters" \
            --query Command.CommandId \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$instance_id"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query Status \
            --output text)" = Success

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - name: Discord notification
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK__OPS_CHANNEL }}
        with:
          args: "${{ github.event.repository.name }} (${{ github.ref_name }}) has been deployed on dev."

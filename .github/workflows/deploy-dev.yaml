name: Deploy to zettaday

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
  workflow_dispatch:

jobs:
  dispatch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the merged development branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-dev.yaml --ref dev

  deploy:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-ssr.yaml
    with:
      environment: dev
      aws_role: arn:aws:iam::402248308880:role/zettaday-landing-home-deployer
      build_api_base_url: https://api.zettaday.com
      origin_stack: zettaday-landing-origin
    secrets:
      clarity_project_id: ${{ secrets.DEV__LANDING__CLARITY_PROJECT_ID }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - name: Discord notification
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK__OPS_CHANNEL }}
        with:
          args: "${{ github.event.repository.name }} (${{ github.ref_name }}) has been deployed on dev."

name: Deploy to zettaday

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-ssr.yaml
    with:
      aws_role: arn:aws:iam::402248308880:role/alphaday-home-dev-home-deployer
      origin_stack: alphaday-home-dev-origin
    secrets:
      clarity_project_id: ${{ secrets.DEV__LANDING__CLARITY_PROJECT_ID }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - name: Discord notification
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK__OPS_CHANNEL }}
        with:
          args: "${{ github.event.repository.name }} (${{ github.ref_name }}) has been deployed on dev."

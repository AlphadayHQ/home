AWSTemplateFormatVersion: "2010-09-09"

# Storage for CloudFront access logs - docs/seo-strategy.md 7.1 and Appendix D.
#
# DEPLOY IN eu-west-1.
#
#   aws cloudformation deploy \
#     --region eu-west-1 \
#     --stack-name alphaday-cf-log-storage \
#     --template-file infra/cloudfront-log-storage.yaml
#
# This is the companion to cloudfront-access-logs.yaml, which MUST deploy in
# us-east-1 because the CloudWatch Logs delivery API only accepts CloudFront
# sources there. CloudFormation is single-region, so the buckets and the
# delivery configuration cannot live in one stack. Deploy this one first: the
# delivery stack references LogBucketName and will fail if it does not exist.

Description: S3 buckets for CloudFront access logs and Athena query results.

Parameters:
  LogBucketName:
    Type: String
    Default: alphaday-cf-logs-v2
    Description: >-
      Deliberately NOT the legacy alphaday-cloudfront-logs bucket. That bucket
      has received flat-key logs from app.alphaday.com (E3OO04R68QCILU) since
      2023-06-05, and the Athena table over that history uses the bucket root
      as its LOCATION. Athena reads a LOCATION recursively, so writing v2 logs
      into any prefix of that bucket would pull a second distribution and a
      second log format into the historical baseline and raise the scan cost
      of every query against it.

  LogRetentionDays:
    Type: Number
    Default: 180
    Description: Access logs are a measurement stream, not an audit trail.

  ResultsBucketName:
    Type: String
    Default: alphaday-athena-results
    Description: Athena refuses to run without an output location.

Resources:
  # Access logs. Retained on stack deletion: by the time anyone deletes this
  # stack the bucket holds months of crawler trend data that cannot be
  # regenerated, which is the whole point of 7.1.
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LogBucketName
      # BucketOwnerEnforced (the default) is correct here. Standard logging v2
      # delivers via a bucket policy that AWS attaches itself, so it needs no
      # ACL. Legacy logging did, which is why Appendix D's original runbook set
      # BucketOwnerPreferred. That step is obsolete under v2.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Expiration only, no Standard-IA transition. CloudFront writes many
          # small objects (measured: ~1.8 KB average), and S3 applies a 128 KB
          # minimum billable size to transitions, so an IA object would bill at
          # 128 KB and cost more than leaving it in Standard. Storage is not
          # where this costs money; PUT requests are.
          - Id: expire-cf-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Athena scratch. Genuinely disposable, so no Retain.
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ResultsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-athena-results
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

Outputs:
  LogBucketName:
    Description: Pass this to the us-east-1 delivery stack.
    Value: !Ref LogBucket
    Export:
      Name: alphaday-cf-log-bucket

  AthenaOutputLocation:
    Description: Athena query result location.
    Value: !Sub "s3://${ResultsBucket}/"

  AthenaTableLocation:
    Description: LOCATION for the partitioned table in athena/cf-logs-tables.sql.
    Value: !Sub "s3://${LogBucket}/AWSLogs/aws-account-id=${AWS::AccountId}/CloudFront/"
